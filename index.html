<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Review Link Generator</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(circle at top left, #1e3a8a, transparent 40%),
                radial-gradient(circle at bottom right, #7c3aed, transparent 40%),
                #0f172a;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("assets/flipkart-1.png");
            background-repeat: no-repeat;
            background-position: right center;
            background-size: cover;
            opacity: 0.16;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 850px;
            position: relative;
            z-index: 1;

            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(59, 130, 246, 0.15);

            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .flipkart-logo {
            height: 60px;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #60a5fa;
        }

        .subtitle {
            margin-top: 8px;
            color: #cbd5e1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group {
            margin-top: 25px;
        }

        input,
        textarea {
            width: 100%;
            padding: 16px;
            background: #111827;
            color: white;

            border: 2px solid #374151;
            border-radius: 14px;

            outline: none;
            transition: .3s;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, .25);
        }

        textarea {
            resize: none;
            height: 120px;
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 #111827;
        }

        textarea::-webkit-scrollbar {
            width: 10px;
        }

        textarea::-webkit-scrollbar-track {
            background: #111827;
            border-radius: 999px;
        }

        textarea::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #60a5fa, #2563eb);
            border-radius: 999px;
            border: 2px solid #111827;
        }

        textarea::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #93c5fd, #3b82f6);
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 #0f172a;
        }

        html::-webkit-scrollbar {
            width: 10px;
        }

        html::-webkit-scrollbar-track {
            background: #0f172a;
        }

        html::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #60a5fa, #2563eb);
            border-radius: 999px;
        }

        html::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #93c5fd, #3b82f6);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            border: none;
            padding: 15px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            transition: .3s;
            min-width: 150px;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .generate-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            width: 100%;
        }

        .copy-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .success {
            display: none;
            margin-top: 15px;
            color: #10b981;
            font-weight: 600;
            text-align: center;
        }

        #qrcode {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        #qrcode img {
            border-radius: 12px;
            background: white;
            padding: 10px;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding-bottom: 10px;
        }

        @media(max-width:700px) {
            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .logo {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="footer">
            Built with ❤️ by Ankit
        </div>

        <div class="header">

            <img class="flipkart-logo" src="assets/Flipkart_Logo.png" alt="Flipkart Logo">

            <div class="logo">
                🛒 Review Link Generator
            </div>

            <div class="subtitle">
                Generate Flipkart Review URLs Instantly
            </div>

        </div>

        <!-- <div class="input-group">
            <label>Product URL</label>
            <input id="productUrl" type="text" placeholder="Paste Flipkart Product URL here...">
        </div> -->

        <div class="input-group" style="padding-bottom: 30px">
            <label>Multiple Product URLs (One Per Line)</label>
            <textarea id="bulkUrls" placeholder="Paste multiple Flipkart URLs here..."
                style="height:200px;"></textarea>
        </div>

        <button class="generate-btn" onclick="generateLinks()">
            ⚡ Generate Review Link(s)
        </button>

        <div class="input-group">

            <label>Generated Review URL</label>

            <div style="display:flex;gap:12px;align-items:flex-start;margin-top:8px;">
                <textarea id="output" readonly style="flex:1;height:150px;"></textarea>

                <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;">
                    <button class="copy-btn" onclick="copyLink()" style="padding:12px 14px;min-width:140px;">📋 Copy
                        Generated Link</button>
                    <div id="successMessage" class="success" style="display:none;margin:0">✅ Link copied!</div>
                </div>
            </div>

        </div>

        <div id="qrcode"></div>



    </div>

    <script>

        function convertToReviewLink(url) {

            try {

                const parsedUrl = new URL(url.trim());

                const pathParts = parsedUrl.pathname.split("/");

                const slug = pathParts[pathParts.length - 3];
                const itemId = pathParts[pathParts.length - 1];

                const pid = parsedUrl.searchParams.get("pid");
                const lid = parsedUrl.searchParams.get("lid");

                if (!pid || !lid || !itemId) {
                    return null;
                }

                return `https://www.flipkart.com/${slug}/write-review/${itemId}?pid=${pid}&lid=${lid}&source=od_sum&otracker=orders`;

            } catch {
                return null;
            }
        }

        function generateLinks() {
            const urls =
                document.getElementById("bulkUrls")
                    .value
                    .split("\n")
                    .filter(url => url.trim());

            if (urls.length === 0) {
                document.getElementById("output").value = "❌ Please enter at least one product URL";
                return;
            }

            const results = [];

            urls.forEach(url => {
                const reviewLink = convertToReviewLink(url);
                results.push(reviewLink || `❌ Invalid URL: ${url}`);
            });

            const generatedText = results.join("\n\n");
            document.getElementById("output").value = generatedText;

            navigator.clipboard.writeText(generatedText).then(() => {
                const success = document.getElementById("successMessage");
                success.style.display = "block";
                setTimeout(() => {
                    success.style.display = "none";
                }, 2000);
            }).catch(() => {
                const success = document.getElementById("successMessage");
                success.textContent = "⚠️ Copy failed";
                success.style.display = "block";
                setTimeout(() => {
                    success.textContent = "✅ Link copied!";
                    success.style.display = "none";
                }, 2000);
            });
        }

        function copyLink() {

            const text =
                document.getElementById("output").value;

            if (!text) return;

            navigator.clipboard.writeText(text);

            const success =
                document.getElementById("successMessage");

            success.style.display = "block";

            setTimeout(() => {
                success.style.display = "none";
            }, 2000);
        }

        function generateQR(text) {

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(
                document.getElementById("qrcode"),
                {
                    text: text,
                    width: 180,
                    height: 180
                }
            );
        }

    </script>

</body>

</html>
