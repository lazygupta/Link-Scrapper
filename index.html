<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipkart Review Link Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2874f0,#0a4cb3);
    padding:20px;
    transition:0.3s;
}

.container{
    width:100%;
    max-width:850px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    transition:0.3s;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.flipkart-logo{
    height:55px;
}

.theme-btn{
    background:#222;
    color:white;
}

.logo{
    text-align:center;
    font-size:2rem;
    font-weight:700;
    color:#2874f0;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:15px;
    outline:none;
    transition:0.3s;
}

input:focus,
textarea:focus{
    border-color:#2874f0;
    box-shadow:0 0 0 4px rgba(40,116,240,0.15);
}

textarea{
    resize:none;
    height:120px;
}

.input-group{
    margin-bottom:20px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

button{
    border:none;
    padding:14px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
}

.generate-btn{
    background:#2874f0;
    color:white;
}

.copy-btn{
    background:#10b981;
    color:white;
}

.open-btn{
    background:#8b5cf6;
    color:white;
}

.clear-btn{
    background:#ef4444;
    color:white;
}

.success{
    color:#10b981;
    margin-top:15px;
    font-weight:600;
    display:none;
}

#qrcode{
    margin-top:25px;
    display:flex;
    justify-content:center;
}

.history{
    margin-top:30px;
}

.history h3{
    margin-bottom:15px;
}

.history-item{
    background:#f5f5f5;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    word-break:break-all;
}

.history-item a{
    text-decoration:none;
    color:#2874f0;
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#777;
    font-size:13px;
}

/* Dark Mode */

.dark-mode{
    background:#111827;
}

.dark-mode .container{
    background:#1f2937;
    color:white;
}

.dark-mode .subtitle,
.dark-mode .footer{
    color:#cbd5e1;
}

.dark-mode input,
.dark-mode textarea{
    background:#374151;
    color:white;
    border-color:#4b5563;
}

.dark-mode .history-item{
    background:#374151;
}

.dark-mode .logo{
    color:#60a5fa;
}

@media(max-width:700px){

    .header{
        flex-direction:column;
        gap:15px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <img
            class="flipkart-logo"
            src="https://logos-world.net/wp-content/uploads/2020/11/Flipkart-Logo.png"
            alt="Flipkart Logo">

        <button
            class="theme-btn"
            onclick="toggleTheme()">
            🌙 Toggle Theme
        </button>

    </div>

    <div class="logo">
        🛒 Review Link Generator
    </div>

    <div class="subtitle">
        Generate Review URLs Instantly
    </div>

    <div class="input-group">

        <label>Product URL</label>

        <input
            id="productUrl"
            type="text"
            placeholder="Paste product URL here...">

    </div>

    <div class="buttons">

        <button
            class="generate-btn"
            onclick="generateReviewLink()">
            Generate Link
        </button>

        <button
            class="copy-btn"
            onclick="copyLink()">
            Copy Link
        </button>

        <button
            class="open-btn"
            onclick="openLink()">
            Open Link
        </button>

        <button
            class="clear-btn"
            onclick="clearHistory()">
            Clear History
        </button>

    </div>

    <br>

    <div class="input-group">

        <label>Generated Review URL</label>

        <textarea
            id="output"
            readonly></textarea>

    </div>

    <div
        id="successMessage"
        class="success">
        ✅ Link copied successfully!
    </div>

    <div id="qrcode"></div>

    <div class="history">

        <h3>Recent Generated Links</h3>

        <div id="historyContainer"></div>

    </div>

    <div class="footer">
        Built with ❤️ by Ankit
    </div>

</div>

<script>

window.onload = function(){

    if(localStorage.getItem("theme") === "dark"){
        document.body.classList.add("dark-mode");
    }

    loadHistory();
};

function generateReviewLink(){

    const url =
        document.getElementById("productUrl").value.trim();

    if(!url){

        alert("Please enter a product URL.");
        return;
    }

    try{

        const parsedUrl = new URL(url);

        const pathParts =
            parsedUrl.pathname.split("/");

        const slug =
            pathParts[pathParts.length - 3];

        const itemId =
            pathParts[pathParts.length - 1];

        const pid =
            parsedUrl.searchParams.get("pid");

        const lid =
            parsedUrl.searchParams.get("lid");

        if(!pid || !lid || !itemId){

            throw new Error();
        }

        const reviewUrl =
`https://www.flipkart.com/${slug}/write-review/${itemId}?pid=${pid}&lid=${lid}&source=od_sum&otracker=orders`;

        document.getElementById("output").value =
            reviewUrl;

        // generateQR(reviewUrl);

        saveHistory(reviewUrl);

    }
    catch{

        document.getElementById("output").value =
            "❌ Invalid Product URL";
    }
}

function copyLink(){

    const text =
        document.getElementById("output").value;

    if(!text) return;

    navigator.clipboard.writeText(text);

    const success =
        document.getElementById("successMessage");

    success.style.display = "block";

    setTimeout(() => {

        success.style.display = "none";

    },2000);
}

function openLink(){

    const link =
        document.getElementById("output").value;

    if(link){

        window.open(link,"_blank");
    }
}

function generateQR(text){

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(
        document.getElementById("qrcode"),
        {
            text:text,
            width:180,
            height:180
        }
    );
}

function saveHistory(link){

    let history =
        JSON.parse(
            localStorage.getItem("reviewHistory")
        ) || [];

    history.unshift(link);

    history = history.slice(0,10);

    localStorage.setItem(
        "reviewHistory",
        JSON.stringify(history)
    );

    loadHistory();
}

function loadHistory(){

    const history =
        JSON.parse(
            localStorage.getItem("reviewHistory")
        ) || [];

    let html = "";

    history.forEach(link => {

        html += `
        <div class="history-item">
            <a href="${link}" target="_blank">
                ${link}
            </a>
        </div>
        `;
    });

    document.getElementById("historyContainer")
        .innerHTML = html;
}

function clearHistory(){

    localStorage.removeItem("reviewHistory");

    loadHistory();
}

function toggleTheme(){

    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){

        localStorage.setItem("theme","dark");

    }else{

        localStorage.setItem("theme","light");
    }
}

document
.getElementById("productUrl")
.addEventListener("keypress",function(e){

    if(e.key === "Enter"){

        generateReviewLink();
    }
});

</script>

</body>
</html>
