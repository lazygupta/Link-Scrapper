<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Review Link Generator</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(circle at top left, #1e3a8a, transparent 40%),
                radial-gradient(circle at bottom right, #7c3aed, transparent 40%),
                #0f172a;
        }

        .container {
            width: 100%;
            max-width: 850px;

            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(59, 130, 246, 0.15);

            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .flipkart-logo {
            height: 60px;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #60a5fa;
        }

        .subtitle {
            margin-top: 8px;
            color: #cbd5e1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group {
            margin-top: 25px;
        }

        input,
        textarea {
            width: 100%;
            padding: 16px;
            background: #111827;
            color: white;

            border: 2px solid #374151;
            border-radius: 14px;

            outline: none;
            transition: .3s;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, .25);
        }

        textarea {
            resize: none;
            height: 120px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            border: none;
            padding: 15px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            transition: .3s;
            min-width: 150px;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .generate-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            width: 100%;
        }

        .copy-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .success {
            display: none;
            margin-top: 15px;
            color: #10b981;
            font-weight: 600;
            text-align: center;
        }

        #qrcode {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        #qrcode img {
            border-radius: 12px;
            background: white;
            padding: 10px;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding-bottom: 10px;
        }

        @media(max-width:700px) {
            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .logo {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="footer">
            Built with ❤️ by Ankit
        </div>

        <div class="header">

            <img class="flipkart-logo" src="assets/Flipkart_Logo.png" alt="Flipkart Logo">

            <div class="logo">
                🛒 Review Link Generator
            </div>

            <div class="subtitle">
                Generate Flipkart Review URLs Instantly
            </div>

        </div>

        <!-- <div class="input-group">
            <label>Product URL</label>
            <input id="productUrl" type="text" placeholder="Paste Flipkart Product URL here...">
        </div> -->

        <div class="buttons" style="margin-top:15px;">
            <button id="singleModeBtn" onclick="showSingleMode()">
                Single Link
            </button>

            <button id="bulkModeBtn" onclick="showBulkMode()">
                Multiple Links
            </button>
        </div>

        <div id="singleMode" style="display:block; padding-bottom: 30px">
            <div class="input-group">
                <label>Product URL</label>
                <input id="productUrl" type="text" placeholder="Paste Flipkart Product URL here...">
            </div>
        </div>

        <div id="bulkMode" style="display:none; padding-bottom: 30px">
            <div class="input-group">
                <label>Multiple Product URLs (One Per Line)</label>
                <textarea id="bulkUrls" placeholder="Paste multiple Flipkart URLs here..."
                    style="height:200px; ;" ></textarea>
            </div>
        </div>

        <button class="generate-btn" onclick="generateLinks()">
            ⚡ Generate Review Link(s)
        </button>

        <div class="input-group">

            <label>Generated Review URL</label>

            <div style="display:flex;gap:12px;align-items:flex-start;margin-top:8px;">
                <textarea id="output" readonly style="flex:1;height:150px;"></textarea>

                <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;">
                    <button class="copy-btn" onclick="copyLink()" style="padding:12px 14px;min-width:140px;">📋 Copy
                        Generated Link</button>
                    <div id="successMessage" class="success" style="display:none;margin:0">✅ Link copied!</div>
                </div>
            </div>

        </div>

        <div id="qrcode"></div>



    </div>

    <script>

        let currentMode = "single";

        function showSingleMode() {
            currentMode = "single";
            document.getElementById("singleMode").style.display = "block";
            document.getElementById("bulkMode").style.display = "none";
        }

        function showBulkMode() {
            currentMode = "bulk";
            document.getElementById("singleMode").style.display = "none";
            document.getElementById("bulkMode").style.display = "block";
        }

        function convertToReviewLink(url) {

            try {

                const parsedUrl = new URL(url.trim());

                const pathParts = parsedUrl.pathname.split("/");

                const slug = pathParts[pathParts.length - 3];
                const itemId = pathParts[pathParts.length - 1];

                const pid = parsedUrl.searchParams.get("pid");
                const lid = parsedUrl.searchParams.get("lid");

                if (!pid || !lid || !itemId) {
                    return null;
                }

                return `https://www.flipkart.com/${slug}/write-review/${itemId}?pid=${pid}&lid=${lid}&source=od_sum&otracker=orders`;

            } catch {
                return null;
            }
        }

        function generateLinks() {

            if (currentMode === "single") {

                const url =
                    document.getElementById("productUrl").value.trim();

                const reviewLink =
                    convertToReviewLink(url);

                document.getElementById("output").value =
                    reviewLink || "❌ Invalid Product URL";

            } else {

                const urls =
                    document.getElementById("bulkUrls")
                        .value
                        .split("\n")
                        .filter(url => url.trim());

                const results = [];

                urls.forEach(url => {

                    const reviewLink =
                        convertToReviewLink(url);

                    results.push(
                        reviewLink ||
                        `❌ Invalid URL: ${url}`
                    );

                });

                document.getElementById("output").value =
                    results.join("\n\n");
            }
        }

        function generateReviewLink() {

            const url =
                document.getElementById("productUrl").value.trim();

            if (!url) {
                alert("Please enter a product URL");
                return;
            }

            try {

                const parsedUrl = new URL(url);

                const pathParts =
                    parsedUrl.pathname.split("/");

                const slug =
                    pathParts[pathParts.length - 3];

                const itemId =
                    pathParts[pathParts.length - 1];

                const pid =
                    parsedUrl.searchParams.get("pid");

                const lid =
                    parsedUrl.searchParams.get("lid");

                if (!pid || !lid || !itemId) {
                    throw new Error();
                }

                const reviewUrl =
                    `https://www.flipkart.com/${slug}/write-review/${itemId}?pid=${pid}&lid=${lid}&source=od_sum&otracker=orders`;

                document.getElementById("output").value =
                    reviewUrl;

            }
            catch {

                document.getElementById("output").value =
                    "❌ Invalid Product URL";

                document.getElementById("qrcode").innerHTML = "";
            }
        }

        function copyLink() {

            const text =
                document.getElementById("output").value;

            if (!text) return;

            navigator.clipboard.writeText(text);

            const success =
                document.getElementById("successMessage");

            success.style.display = "block";

            setTimeout(() => {
                success.style.display = "none";
            }, 2000);
        }

        function generateQR(text) {

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(
                document.getElementById("qrcode"),
                {
                    text: text,
                    width: 180,
                    height: 180
                }
            );
        }

        document
            .getElementById("productUrl")
            .addEventListener("keypress", function (e) {

                if (e.key === "Enter") {
                    generateReviewLink();
                }

            });

    </script>

</body>

</html>
